              <div> 龙源峡景区位处赣北九岭山脉东南端，总面积2.73平方公里。空气负离子浓度达到国家一级标准，生物多样性丰富，拥有多种珍贵树种和野生保护动物，生物景观、地质地貌景观、水体景观和天象景观浑然天成。      远山如黛、近水含烟，龙源峡群山环伺穿越峡谷，六百亩水域风光旖旎。四季景色独具特色，春赏桐花烟雨，夏纳湖面凉风，秋观层林尽染，冬览玉树银花，有着&ldquo;东方亚马逊&rdquo;、&ldquo;南国九寨沟&rdquo;的美誉。      景区呈现&ldquo;人间仙境，度假胜地；浪漫之源，龙情峡逸&rdquo;的核心主题，为游客提供&ldquo;住仙居、享仙厨、识仙草、尝仙品&rdquo;的特色专属新体验，尽享&ldquo;探寻浪漫仙境之旅&rdquo;。</div>
